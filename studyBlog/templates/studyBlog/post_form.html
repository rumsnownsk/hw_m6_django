{% extends 'base.html' %}
{% block content %}
<h1>{% if object %}Редактировать пост{% else %}Создать пост{% endif %}</h1>
<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Сохранить</button>
</form>
<p><a href="{% url 'studyBlog:post_list' %}">Отмена</a></p>
{% endblock %}
